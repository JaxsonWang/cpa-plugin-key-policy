# cpa-key-policy plugin config. Replace placeholders and do not commit secrets.
enabled: true
state_file: ./cpa-key-policy-state.json

keys:
  - id: team-a
    name: Team A
    enabled: true
    key_hash: "sha256:REPLACE_WITH_SHA256_HEX"
    key_preview: "cpa_..."
    rpm: 60
    daily_limit_usd: 10
    weekly_limit_usd: 50
    allow_models_endpoint: false
    models:
      - model: gpt-5.4
        billing_mode: tokens
        input_price_per_million: 2
        output_price_per_million: 8
        cache_read_price_per_million: 0.2
      - model: image-model
        billing_mode: per_call
        per_call_usd: 0.04
